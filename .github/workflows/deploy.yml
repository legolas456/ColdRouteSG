# Deploys the frontend to the earlier Amplify app (daledp6z7ncmz), by hand
# only. The live console is built and deployed with the rest of the AWS stack
# by `terraform apply` (infra/), so merges to main no longer publish here.
# Keys come from the repository secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY (IAM user coldroute-deployer, Amplify-only policy).
# See docs/deployment.md.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-amplify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and upload to Amplify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-1
          AMPLIFY_APP_ID: daledp6z7ncmz
          AMPLIFY_BRANCH: main
        run: ./scripts/deploy-frontend.sh
